[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ggufbench"
version = "0.1.0"
description = "Local model benchmarking (llama.cpp + Strata)"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest", "pytest-benchmark", "mypy"]
